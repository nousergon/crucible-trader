name: Provider direct-linkage guard

# Reusable-workflow caller: see the header comment in nousergon/nousergon-lib's
# own provider-linkage-guard.yml for the full rationale. Wired here by the
# roster rollout (alpha-engine-config-I7777). Measured 2026-10-30 against
# this repo's main with --include-dist: 4 uv.lock matches, all pre-cleared with a
# reason and an expiry in .provider-linkage-allowlist.yaml. Any NEW direct
# provider linkage fails this check from day one.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@f728a4f7a42c5ba325953c8b87b3bc3c3bad71df
