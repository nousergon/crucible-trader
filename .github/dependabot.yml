# Standard fleet Dependabot config (weekly, grouped minor+patch) —
# `repository-baseline-policy` §4.3. Version-update PRs merge under
# `auto-merge-policy`'s Dependabot lane, not by hand.
version: 2
updates:
  # `uv`, NOT `pip`. This repository's dependencies are locked in `uv.lock` and
  # `ci.yml` runs `uv lock --check` before anything installs. The `pip`
  # ecosystem edits `pyproject.toml` and leaves the lockfile alone, so every
  # version-update PR it opened would fail that step and NONE could ever merge,
  # however green the tests were — measured on `nousergon/crucible`
  # (crucible-PR175..179, 2026-09-09, five PRs all failing with
  # "The lockfile at uv.lock needs to be updated, but --check was provided").
  # Mirrored here at birth rather than rediscovered.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # `crucible` is pinned by GIT SHA (see the pin's rationale in
    # `pyproject.toml`), and Dependabot's `uv` updater cannot follow a git
    # direct reference: it looks the NAME up on PyPI, finds the unrelated
    # `crucible` project there (mspinola/crucible, latest 0.7.0) and tries to
    # re-lock with `crucible==0.7.0`. Measured on the weekly `uv` runs
    # 34785701550 (2026-09-13) and 36353960358 (2026-09-27): that attempt
    # fails resolution and turns the whole job red, while the real
    # updates in the same run (e.g. `ruff`) still open their PR.
    #
    # Ignoring it loses nothing: the sha only moves by a deliberate PR that
    # edits the pin, because the trader runs the release named by
    # `trader/release_pin` and the two shas are required to agree. And the
    # failure mode it removes is not cosmetic: a resolution that SUCCEEDED
    # would be a Dependabot PR proposing a stranger's package under this name
    # — and one can: substituting `crucible==0.7.0` for the git pin and running
    # `uv lock` resolves cleanly to the PyPI wheel (measured 2026-10-02).
    ignore:
      - dependency-name: crucible
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
